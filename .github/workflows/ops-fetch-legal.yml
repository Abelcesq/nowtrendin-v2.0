# Rights diligence (§16 gate 5): fetch the CURRENT public license/terms pages of
# data vendors from a GitHub runner (this repo's cloud sessions are egress-blocked
# to vendor sites) and commit DATED PLAIN-TEXT SNAPSHOTS to docs/buyer-diligence/
# tos-snapshots/. The RIGHTS_REGISTER cites these snapshots by date, so a rights
# determination is always anchored to the exact text it was made on. Read-only
# fetches; text extraction strips markup only, never rewrites wording.
name: Ops - fetch legal terms snapshots

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    if: github.repository == 'Abelcesq/nowtrendin-v2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and snapshot vendor legal pages
        run: |
          python3 - <<'PYEOF'
          import datetime, html.parser, pathlib, urllib.request

          OUT = pathlib.Path("docs/buyer-diligence/tos-snapshots")
          OUT.mkdir(parents=True, exist_ok=True)
          today = datetime.date.today().isoformat()

          class Text(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts = []; self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript"): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript") and self.skip: self.skip -= 1
              def handle_data(self, d):
                  if not self.skip and d.strip(): self.parts.append(d.strip())

          TARGETS = {
              "coinapi": ["https://www.coinapi.io/legal/terms-of-use",
                          "https://www.coinapi.io/terms-of-use",
                          "https://www.coinapi.io/legal",
                          "https://www.coinapi.io/eula"],
              "coinmetrics": ["https://coinmetrics.io/terms-of-service/",
                              "https://coinmetrics.io/community-data-terms-of-use/",
                              "https://coinmetrics.io/terms/"],
              "coinbase": ["https://www.coinbase.com/legal/market_data",
                           "https://www.coinbase.com/legal/user_agreement/united_states"],
          }
          for vendor, urls in TARGETS.items():
              got = False
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":
                          "Mozilla/5.0 (compatible; nowtrendin-rights-diligence/1.0)"})
                      raw = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
                  except Exception as e:  # noqa: BLE001
                      print(f"[{vendor}] {url} -> {type(e).__name__}: {e}")
                      continue
                  p = Text(); p.feed(raw)
                  text = "\n".join(p.parts)
                  if len(text) < 500:
                      print(f"[{vendor}] {url} -> too little text ({len(text)} chars), trying next")
                      continue
                  slug = url.rstrip("/").rsplit("/", 1)[-1] or vendor
                  path = OUT / f"{vendor}_{slug}_{today}.txt"
                  path.write_text(f"SNAPSHOT {today} of {url}\n{'='*72}\n{text}\n", encoding="utf-8")
                  print(f"[{vendor}] saved {path} ({len(text)} chars)")
                  got = True
              if not got:
                  print(f"[{vendor}] NO PAGE CAPTURED — every candidate URL failed")
          PYEOF
      - name: Commit snapshots
        run: |
          git config user.email "actions@github.com"
          git config user.name "rights-diligence"
          git add docs/buyer-diligence/tos-snapshots
          if git diff --cached --quiet; then echo "no new snapshots"; exit 0; fi
          git commit -m "rights diligence: vendor terms snapshots ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
