# One-button ops: VACUUM ANALYZE the hot table (stage-2 fix, evidence-backed).
# EVIDENCE (release-log diagnostics, 2026-09-14): velocity_scores = 4.16M rows /
# 4,177 MB with last_autovacuum = None and last_vacuum = None — never maintained.
# Stale stats + no visibility map force a 4.1 GB seq scan + disk-spilling hash
# aggregate at work_mem=4MB → multi-minute superset builds. FIRST ATTEMPT of this
# op (05:15 UTC) launched a dyno whose over-clever inline command died silently —
# the 17:23 [diag] still showed last_vacuum: None. This version base64-encodes the
# payload (quoting-proof) and the one-off runs ATTACHED-equivalent verification by
# printing to the app log; the authoritative verification remains the next release
# [diag] block showing last_vacuum set and the row estimate ≈ n_live_tup.
# Plain VACUUM only — no exclusive lock, safe under live traffic. NEVER VACUUM FULL.
name: Ops - vacuum hot table

on:
  workflow_dispatch: {}

jobs:
  vacuum:
    if: github.repository == 'Abelcesq/nowtrendin-v2.0'
    runs-on: ubuntu-latest
    steps:
      - name: Launch one-off dyno running VACUUM ANALYZE velocity_scores
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then echo "::error::HEROKU_API_KEY not set"; exit 1; fi
          cat > /tmp/vac.py <<'PYEOF'
          import os, time, psycopg2
          c = psycopg2.connect(os.environ["DATABASE_URL"])
          c.autocommit = True
          cur = c.cursor()
          cur.execute("SET statement_timeout = 0")
          t = time.time()
          print("[vacuum] starting VACUUM (ANALYZE) velocity_scores ...", flush=True)
          cur.execute("VACUUM (ANALYZE) velocity_scores")
          print("[vacuum] done in %.1fs" % (time.time() - t), flush=True)
          cur.execute("SELECT n_live_tup, n_dead_tup, last_vacuum, last_analyze "
                      "FROM pg_stat_user_tables WHERE relname='velocity_scores'")
          print("[vacuum] pg_stat:", cur.fetchone(), flush=True)
          PYEOF
          B64=$(python3 -c "import base64;print(base64.b64encode(open('/tmp/vac.py','rb').read()).decode())")
          CMD="python -c \"import base64;exec(base64.b64decode('$B64').decode())\""
          BODY=$(CMD="$CMD" python3 -c "import json,os;print(json.dumps({'command': os.environ['CMD'], 'attach': False, 'time_to_live': 3600}))")
          curl -sS -X POST "https://api.heroku.com/apps/nowtrendin-v2-engine/dynos" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('one-off dyno:', d.get('name', d), '| state:', d.get('state'))"
          echo "VACUUM launched detached (several minutes on 4.1 GB). Output -> app log stream."
          echo "Authoritative verification: next release [diag] shows last_vacuum set."
