# PR CI (board N7: the deploy workflow was the ONLY gate, so tests first ran at
# deploy time — a red gate silently left main ahead of prod). This runs the same
# gates on every pull request and on pushes to non-main branches, so breakage is
# visible BEFORE merge. No secrets, no deploy — safe on forks (where it simply runs
# the public test suite).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - 'transfer/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test gate + integrity gate
        run: |
          pip install -q -r transfer/requirements.txt python-dotenv vaderSentiment
          python -c "import nltk; nltk.download('stopwords', quiet=True); nltk.download('punkt', quiet=True)"
          python tools/run_tests.py
          python tools/integrity_gate.py
